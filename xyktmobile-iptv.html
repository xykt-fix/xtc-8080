<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Stream Admin Panel</title>
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --accent-purple: #8b5cf6;
            --accent-purple-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --status-online: #10b981;
            --status-offline: #ef4444;
            --border-color: #334155;
            --sidebar-width: 260px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Sidebar Navigation --- */
        aside {
            width: var(--sidebar-width);
            background-color: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .brand {
            padding: 24px;
            font-size: 20px;
            font-weight: 700;
            color: var(--accent-purple);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-list {
            list-style: none;
            padding: 20px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .menu-item a {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            color: var(--text-muted);
            text-decoration: none;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .menu-item.active a, .menu-item a:hover {
            background-color: var(--accent-purple);
            color: var(--text-main);
        }

        /* --- Main Content Container --- */
        main {
            margin-left: var(--sidebar-width);
            flex-grow: 1;
            padding: 40px;
            width: calc(100% - var(--sidebar-width));
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
        }

        .user-profile img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #cbd5e1;
        }

        /* --- KPI Dashboard Cards --- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .card {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 24px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info h3 {
            font-size: 14px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card-info p {
            font-size: 28px;
            font-weight: 700;
        }

        .card-icon {
            font-size: 24px;
            padding: 12px;
            background-color: rgba(139, 92, 246, 0.1);
            color: var(--accent-purple);
            border-radius: 8px;
        }

        /* --- Panels & Tables --- */
        .content-panel {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 30px;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn-action {
            background-color: var(--accent-purple);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background-color: var(--accent-purple-hover);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px 16px;
            color: var(--text-muted);
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            font-size: 14px;
        }

        td {
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }

        /* --- Status Badges --- */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .badge-online { background-color: rgba(16, 185, 129, 0.15); color: var(--status-online); }
        .badge-offline { background-color: rgba(239, 68, 68, 0.15); color: var(--status-offline); }

        /* --- Live Streams Grid --- */
        .stream-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }

        .stream-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-primary);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stream-details h4 { font-size: 15px; margin-bottom: 4px; }
        .stream-details p { font-size: 13px; color: var(--text-muted); }

        /* Responsive Breakpoint */
        @media (max-width: 992px) {
            aside { width: 70px; }
            aside .brand span, aside .menu-item span { display: none; }
            main { margin-left: 70px; width: calc(100% - 70px); padding: 20px; }
        }
    </style>
</head>
<body>

    <!-- Sidebar Section -->
    <aside>
        <div class="brand">
            <i class="fa-solid fa-satellite-dish"></i>
            <span>NEXUS IPTV</span>
        </div>
        <ul class="menu-list">
            <li class="menu-item active"><a href="#"><i class="fa-solid fa-chart-pie"></i> <span>Dashboard</span></a></li>
            <li class="menu-item"><a href="#"><i class="fa-solid fa-users"></i> <span>Subscribers</span></a></li>
            <li class="menu-item"><a href="#"><i class="fa-solid fa-tv"></i> <span>Live Streams</span></a></li>
            <li class="menu-item"><a href="#"><i class="fa-solid fa-folder-open"></i> <span>VOD Library</span></a></li>
            <li class="menu-item"><a href="#"><i class="fa-solid fa-server"></i> <span>Servers</span></a></li>
            <li class="menu-item"><a href="#"><i class="fa-solid fa-gears"></i> <span>Settings</span></a></li>
        </ul>
    </aside>

    <!-- Main Content Container -->
    <main>
        <header>
            <div>
                <h1>Dashboard Overview</h1>
                <p style="color: var(--text-muted); margin-top: 4px;">Real-time stream and license tracking</p>
            </div>
            <div class="user-profile">
                <img src="https://placeholder.com" alt="Admin Avatar">
                <span style="font-weight: 500; font-size: 14px;">Administrator</span>
            </div>
        </header>

        <!-- KPI Data Metric Row -->
        <section class="stats-grid">
            <div class="card">
                <div class="card-info">
                    <h3>Active Connections</h3>
                    <p id="active-conn-count">1,482</p>
                </div>
                <div class="card-icon"><i class="fa-solid fa-network-wired"></i></div>
            </div>
            <div class="card">
                <div class="card-info">
                    <h3>Total Users</h3>
                    <p>4,912</p>
                </div>
                <div class="card-icon"><i class="fa-solid fa-user-group"></i></div>
            </div>
            <div class="card">
                <div class="card-info">
                    <h3>Online Streams</h3>
                    <p>320 / 324</p>
                </div>
                <div class="card-icon"><i class="fa-solid fa-play"></i></div>
            </div>
            <div class="card">
                <div class="card-info">
                    <h3>Server Network Load</h3>
                    <p>42.8%</p>
                </div>
                <div class="card-icon"><i class="fa-solid fa-microchip"></i></div>
            </div>
        </section>

        <!-- Subscriber Line Manager Panel -->
        <section class="content-panel">
